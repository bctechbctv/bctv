<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <title>即時新聞走馬燈 - 企業藍色超慢版</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: "PingFang HK", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }
    .ticker-container {
      width: 100vw; height: 60px;
      /* LOGO 企業深藍漸層底色 */
      background: linear-gradient(180deg, rgba(0, 64, 152, 0.95) 0%, rgba(0, 32, 76, 0.98) 100%);
      color: #ffffff;
      display: flex; align-items: center;
      box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.6);
      border-top: 3px solid #00ADEF;
    }
    .badge {
      /* LOGO 亮藍色標籤 */
      background: linear-gradient(135deg, #00ADEF 0%, #0087cb 100%);
      color: #ffffff;
      padding: 0 25px; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 20px; white-space: nowrap;
      z-index: 10; box-shadow: 4px 0 10px rgba(0,0,0,0.4);
      letter-spacing: 2px;
    }
    .marquee-wrapper { flex: 1; overflow: hidden; white-space: nowrap; }
    .marquee-content {
      display: inline-block; white-space: nowrap;
      padding-left: 100vw;
      /* 時間改為 180 秒，速度極度平緩超慢 */
      animation: marquee 180s linear infinite;
      font-size: 24px; font-weight: 500; line-height: 60px;
    }
    
    /* 每條新聞的分隔符號與超寬間距 */
    .separator {
      color: #00ADEF;
      margin: 0 60px; /* 大幅加寬新聞之間的距離 */
      font-weight: bold;
      font-size: 18px;
    }

    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>
<body>
  <div class="ticker-container">
    <div class="badge">即時新聞</div>
    <div class="marquee-wrapper">
      <div class="marquee-content" id="news-text">正在載入新聞...</div>
    </div>
  </div>

  <script>
    async function loadNews() {
      try {
        const res = await fetch('news.txt?t=' + new Date().getTime());
        if (res.ok) {
          const text = await res.text();
          if (text.trim()) {
            // 將原本以 ' ✦ ' 分隔的新聞，用自訂樣式拉開間距
            const newsItems = text.split(' ✦ ');
            const formattedHTML = newsItems.join('<span class="separator">◆</span>');
            document.getElementById('news-text').innerHTML = formattedHTML;
          }
        }
      } catch (e) {
        console.error(e);
      }
    }
    loadNews();
    setInterval(loadNews, 30000); // 每 30 秒自動刷新
  </script>
</body>
</html>
